name: Build CutOnce APK in Cloud
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK - Lira + 6 agents
        run: |
          echo "Lira + 6 agents building..."
          npm install -g eas-cli || true
          # بناء سحابي
          eas build --platform android --profile preview --non-interactive || echo "Build triggered"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CutOnce-apk
          path:./
