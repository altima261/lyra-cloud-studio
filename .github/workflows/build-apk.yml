name: Build Lyra Cloud Studio
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Studio PWA
        run: |
          echo "Building Lyra Studio - Lira + 6 agents..."
          mkdir -p dist
          cp *.html dist/ 2>/dev/null || echo "No html yet"
          echo '<h1>Lyra Cloud Studio - Ready</h1><p>Lira + 6 agents</p>' > dist/index.html
          ls -la dist/

      - name: Upload Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyra-studio-pwa
          path: dist/
